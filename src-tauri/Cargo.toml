[package]
name = "lastwar-trainer"
version = "0.1.0"
edition = "2021"
description = "Desktop-Trainer für Last War: Survival Game (Rust-Kern + Tauri 2)"
license = "MIT"

[lib]
name = "lastwar_core"
path = "src/lib.rs"

[[bin]]
name = "lastwar-trainer"
path = "src/main.rs"
required-features = ["gui"]

[features]
default = []
gui = ["dep:tauri"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
tauri = { version = "2", optional = true, features = ["devtools"] }

[build-dependencies]
tauri-build = "2"

[profile.release]
opt-level = 2
